# Deploy the Ghost Registry (web/) to GitHub Pages. BUILD_SPEC §10.
# Action tags verified 2026-10-30 via the GitHub API: actions/checkout@v7 (v7.0.1),
# actions/configure-pages@v6 (v6.0.0), actions/upload-pages-artifact@v5 (v5.0.0),
# actions/deploy-pages@v5 (v5.0.1).
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# web/ is static and public-safe (tests/test_public_leak.py runs in CI before this matters).
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
