[project]
name = "phantom-packages"
version = "0.1.0"
description = "Measure, predict and block pip packages that AI coding models hallucinate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# TabPFN pulls in torch; kept optional so CI and the online guard stay light.
model = ["tabpfn>=9.2"]
# Hosted Ultramarine arm (OpenAI-compatible SDK).
hosted = ["openai>=1.50"]

[project.scripts]
phantom = "phantom.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phantom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
